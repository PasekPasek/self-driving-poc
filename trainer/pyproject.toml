[project]
name = "trainer"
version = "0.1.0"
description = "Car simulation and neuroevolution trainer for the self-driving replay demo"
requires-python = ">=3.12"
dependencies = ["numpy"]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
